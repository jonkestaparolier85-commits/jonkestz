<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NathOs - Le TikTok Privé</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #000; 
            color: #fff;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }

        .phone-container {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background: #121212;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
            overflow: hidden;
        }

        @media (min-width: 415px) {
            .phone-container {
                height: 90vh;
                border-radius: 40px;
                border: 8px solid #333;
            }
        }

        /* Écran de Connexion */
        .auth-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0f0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 10;
        }
        .logo-title {
            font-size: 2.5em;
            font-weight: 900;
            color: #fe2c55;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }
        .logo-sub {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 40px;
        }
        .auth-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #262626;
            border: 1px solid #3f3f3f;
            border-radius: 10px;
            color: white;
            font-size: 1em;
            outline: none;
        }
        .auth-input:focus { border-color: #fe2c55; }
        .auth-btn {
            width: 100%;
            padding: 15px;
            background: #fe2c55;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Interface Principale (Fil Vidéo) */
        .app-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .top-bar {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #222;
            background: rgba(18,18,18,0.9);
            position: absolute;
            top: 0; width: 100%;
            z-index: 5;
            font-size: 1.1em;
        }
        .top-bar span { color: #fe2c55; }

        .feed-container {
            flex-grow: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            padding-top: 50px;
            padding-bottom: 60px;
        }

        .video-card {
            width: 100%;
            height: calc(100% - 110px);
            min-height: 450px;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            background: #000;
            border-bottom: 1px solid #222;
        }
        .video-card video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .video-info {
            position: relative;
            z-index: 2;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 15px;
            margin: -20px;
            margin-top: 0;
        }
        .author-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .video-desc {
            font-size: 0.9em;
            color: #ddd;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Barre de navigation / Ajout de vidéo en bas */
        .bottom-nav {
            position: absolute;
            bottom: 0; width: 100%;
            height: 60px;
            background: #000;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 5;
            padding: 0 10px;
        }
        .nav-btn {
            background: #fe2c55;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
        }
        .user-status {
            font-size: 0.8em;
            color: #aaa;
        }

        /* Modale d'ajout de vidéo depuis la galerie */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 20;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #1f1f1f;
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content h3 { color: #fe2c55; text-align: center; }
        
        .file-upload-label {
            background: #262626;
            border: 2px dashed #fe2c55;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            color: #ccc;
            font-size: 0.9em;
        }
        .file-upload-label input { display: none; }
    </style>
</head>
<body>

<div class="phone-container">
    
    <div class="auth-screen" id="authScreen">
        <div class="logo-title">NATHOS</div>
        <div class="logo-sub">Votre TikTok Privé</div>
        
        <input type="text" id="inputName" class="auth-input" placeholder="Ton Prénom (ex: Osée, Nathanaël...)">
        <input type="text" id="inputMatricule" class="auth-input" placeholder="Numéro Matricule">
        
        <button class="auth-btn" onclick="login()">Entrer sur NathOs</button>
    </div>

    <div class="app-screen" id="appScreen">
        <div class="top-bar">NATHOS <span>Feed</span></div>
        
        <div class="feed-container" id="feedContainer">
            </div>

        <div class="bottom-nav">
            <span class="user-status" id="currentUserDisplay">Connecté</span>
            <button class="nav-btn" onclick="openModal()">+ Choisir de la Galerie</button>
        </div>
    </div>

    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h3>Publier une vidéo</h3>
            
            <label class="file-upload-label">
                <span id="fileNameDisplay">📂 Appuyez pour choisir une vidéo de votre galerie</span>
                <input type="file" id="videoFile" accept="video/*" onchange="handleFileSelect(this)">
            </label>

            <input type="text" id="videoDesc" class="auth-input" placeholder="Écris une légende...">
            <button class="auth-btn" onclick="publishVideo()">Publier sur NathOs</button>
            <button style="background: #444;" class="auth-btn" onclick="closeModal()">Annuler</button>
        </div>
    </div>

</div>

<script>
    let currentUser = {};
    let selectedVideoDataUrl = "";

    // Fonction de connexion par Nom et Matricule
    function login() {
        const name = document.getElementById('inputName').value.trim();
        const matricule = document.getElementById('inputMatricule').value.trim();

        if (name === "" || matricule === "") {
            alert("Veuillez remplir ton nom et ton numéro matricule.");
            return;
        }

        currentUser = { name: name, matricule: matricule };
        document.getElementById('currentUserDisplay').innerText = name;

        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'flex';

        loadVideos();
    }

    // Gestion de la modale
    function openModal() {
        document.getElementById('uploadModal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('uploadModal').style.display = 'none';
        selectedVideoDataUrl = "";
        document.getElementById('fileNameDisplay').innerText = "📂 Appuyez pour choisir une vidéo de votre galerie";
    }

    // Récupérer le fichier vidéo directement de la galerie de l'appareil
    function handleFileSelect(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            document.getElementById('fileNameDisplay').innerText = "✅ " + file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedVideoDataUrl = e.target.result; // Convertit la vidéo en format stockable
            };
            reader.readAsDataURL(file);
        }
    }

    // Publier la vidéo de la galerie
    function publishVideo() {
        const desc = document.getElementById('videoDesc').value.trim();

        if (selectedVideoDataUrl === "") {
            alert("Veuillez d'abord sélectionner une vidéo depuis votre galerie.");
            return;
        }

        const newVideo = {
            author: currentUser.name,
            matricule: currentUser.matricule,
            url: selectedVideoDataUrl,
            desc: desc || "Ma vidéo NathOs 🚀",
            time: Date.now()
        };

        // Sauvegarde dans la mémoire du navigateur / téléphone
        let videos = JSON.parse(localStorage.getItem('nathos_gallery_videos')) || [];
        videos.unshift(newVideo);
        localStorage.setItem('nathos_gallery_videos', JSON.stringify(videos));

        document.getElementById('videoDesc').value = "";
        closeModal();
        loadVideos();
    }

    // Charger les vidéos de la galerie
    function loadVideos() {
        const feed = document.getElementById('feedContainer');
        feed.innerHTML = "";

        let videos = JSON.parse(localStorage.getItem('nathos_gallery_videos')) || [];

        if (videos.length === 0) {
            feed.innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; height:100%; text-align:center; padding:20px; color:#777;">
                    Aucune vidéo pour le moment.<br>Clique sur "+ Choisir de la Galerie" pour poster la première !
                </div>
            `;
            return;
        }

        videos.forEach(v => {
            const card = document.createElement('div');
            card.classList.add('video-card');

            card.innerHTML = `
                <video src="${v.url}" controls autoplay loop muted playsinline></video>
                <div class="video-info">
                    <div class="author-name">@${v.author}</div>
                    <div class="video-desc">${v.desc}</div>
                </div>
            `;
            feed.appendChild(card);
        });
    }
</script>

</body>
</html>
