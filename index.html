<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire de Satisfaction - KATEX STORE</title>
    <style>
        /* Style général */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6d7;
            color: #011f2a;
            margin: 0;
            padding: 20px;
        }

        /* En-tête principal en Vert dominant */
        header {
            background-color: #014e48;
            color: #ffffff;
            text-align: center;
            padding: 25px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        /* Style du Logo */
        .logo {
            max-width: 140px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* Container du formulaire */
        .form-container {
            max-width: 650px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border-top: 6px solid #014e48;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Style des questions */
        .question-group {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ffe6d7;
        }

        label {
            display: block;
            font-weight: bold;
            color: #014e48;
            margin-bottom: 8px;
        }

        /* Style des champs de saisie */
        select, input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #014e48;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        /* Image secondaire de présentation */
        .section-image {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }

        /* Bouton d'envoi en Orange */
        button {
            width: 100%;
            background-color: #fb874c;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #014e48;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <!-- En-tête avec Logo -->
        <header>
            <img src="XCVDV.jpg" alt="Logo KATEX STORE" class="logo">
            <h1>KATEX STORE</h1>
            <p>Votre avis compte ! Aidez-nous à améliorer nos services.</p>
        </header>

        <form action="#" method="POST">

            <!-- Question 1 -->
            <div class="question-group">
                <label for="q1">1. Comment évaluez-vous la qualité globale de nos produits / services ?</label>
                <select id="q1" name="q1" required>
                    <option value="">-- Sélectionnez une réponse --</option>
                    <option value="excellent">Très Satisfait</option>
                    <option value="bon">Satisfait</option>
                    <option value="moyen">Moyen</option>
                    <option value="mauvais">Insatisfait</option>
                </select>
            </div>

            <!-- Question 2 -->
            <div class="question-group">
                <label for="q2">2. Comment trouvez-vous l'accueil et la politesse de notre équipe ?</label>
                <select id="q2" name="q2">
                    <option value="">-- Sélectionnez une réponse --</option>
                    <option value="excellent">Excellent</option>
                    <option value="bon">Bon</option>
                    <option value="moyen">Passable</option>
                    <option value="mauvais">À améliorer</option>
                </select>
            </div>

            <!-- Question 3 -->
            <div class="question-group">
                <label for="q3">3. Nos agents ont-ils bien répondu à vos besoins ?</label>
                <select id="q3" name="q3">
                    <option value="">-- Sélectionnez une réponse --</option>
                    <option value="oui-tout-a-fait">Oui, tout à fait</option>
                    <option value="partiellement">Partiellement</option>
                    <option value="non">Non, pas du tout</option>
                </select>
            </div>

            <!-- Question 4 -->
            <div class="question-group">
                <label for="q4">4. Que pensez-vous du temps d'attente ou du délai de livraison ?</label>
                <select id="q4" name="q4">
                    <option value="">-- Sélectionnez une réponse --</option>
                    <option value="tres-rapide">Très rapide</option>
                    <option value="acceptable">Acceptable</option>
                    <option value="trop-long">Trop long</option>
                </select>
            </div>

            <!-- Question 5 -->
            <div class="question-group">
                <label for="q5">5. Comment trouvez-vous le rapport qualité / prix de KATEX STORE ?</label>
                <select id="q5" name="q5">
                    <option value="">-- Sélectionnez une réponse --</option>
                    <option value="tres-bon">Très raisonnable</option>
                    <option value="correct">Correct</option>
                    <option value="eleve">Trop cher</option>
                </select>
            </div>

            <!-- Question 6 -->
            <div class="question-group">
                <label for="q6">6. Le processus de commande / d'achat était-il facile ?</label>
                <select id="q6" name="q6">
                    <option value="">-- Sélectionnez une réponse --</option>
                    <option value="tres-facile">Très facile</option>
                    <option value="moyen">Moyennement facile</option>
                    <option value="difficile">Compliqué</option>
                </select>
            </div>

            <!-- Question 7 -->
            <div class="question-group">
                <label for="q7">7. Recommanderiez-vous KATEX STORE à vos amis ou proches ?</label>
                <select id="q7" name="q7">
                    <option value="">-- Sélectionnez une réponse --</option>
                    <option value="certainement">Oui, certainement</option>
                    <option value="peut-etre">Peut-être</option>
                    <option value="non">Non</option>
                </select>
            </div>

            <!-- Question 8 -->
            <div class="question-group">
                <label for="q8">8. À quelle fréquence utilisez-vous nos services ?</label>
                <select id="q8" name="q8">
                    <option value="">-- Sélectionnez une réponse --</option>
                    <option value="regulier">Régulièrement (plusieurs fois par mois)</option>
                    <option value="occasionnel">Occasionnellement</option>
                    <option value="premiere-fois">C'était ma première fois</option>
                </select>
            </div>

            <!-- Question 9 -->
            <div class="question-group">
                <label for="q9">9. Quel est le point fort principal de KATEX STORE d'après vous ?</label>
                <input type="text" id="q9" name="q9" placeholder="Ex: La qualité des produits, l'accueil...">
            </div>

            <!-- Question 10 avec Deuxième Image -->
            <div class="question-group">
                <label for="q10">10. Avez-vous des suggestions ou des remarques pour nous aider à nous améliorer ?</label>
                <textarea id="q10" name="q10" placeholder="Écrivez votre avis ici..."></textarea>
                <img src="ZZezqez.jpg" alt="KATEX STORE visuel" class="section-image">
            </div>

            <!-- Bouton Valider -->
            <button type="submit">ENVOYER MON AVIS</button>

        </form>
    </div>

</body>
</html>
